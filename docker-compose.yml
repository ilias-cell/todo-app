# docker-compose.yml

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: todouser
      POSTGRES_PASSWORD: todopass
      POSTGRES_DB: tododb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://todouser:todopass@db:5432/tododb
    depends_on:
      - db
    volumes:
      - ./src:/app/src
      - ./prisma:/app/prisma

volumes:
  postgres_data: