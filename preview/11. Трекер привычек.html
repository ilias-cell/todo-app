<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Привычки</title>
  <style>
    :root {
      --n-0: oklch(98.5% 0.002 264);
      --n-1: oklch(97% 0.002 264);
      --n-2: oklch(93% 0.003 264);
      --n-3: oklch(88% 0.004 264);
      --n-4: oklch(82% 0.004 264);
      --n-5: oklch(68% 0.006 264);
      --n-6: oklch(52% 0.008 264);
      --n-7: oklch(38% 0.010 264);
      --n-9: oklch(15% 0.014 264);

      --bg: var(--n-0);
      --surface: var(--n-1);
      --raised: var(--n-2);
      --border: var(--n-3);
      --border-soft: var(--n-4);
      --text: var(--n-9);
      --text-sec: var(--n-7);
      --text-muted: var(--n-6);
      --text-ghost: var(--n-5);
      --accent: var(--n-9);
      --accent-fg: var(--n-0);
      --info: oklch(60% 0.14 240);
      --info-bg: oklch(96% 0.03 240);
      --success: oklch(58% 0.14 148);
      --success-bg: oklch(96% 0.03 148);
      --danger: oklch(55% 0.18 25);
      --danger-bg: oklch(97% 0.03 25);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      font-size: 15px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    button {
      font: inherit;
    }

    .workspace {
      width: min(680px, 100%);
      margin: 0 auto;
      padding: 0 24px 80px;
    }

    .nav {
      display: flex;
      gap: 28px;
      overflow-x: auto;
      border-bottom: 1px solid var(--border-soft);
      padding-top: 20px;
      scrollbar-width: none;
    }

    .nav::-webkit-scrollbar {
      display: none;
    }

    .nav-tab {
      position: relative;
      flex: 0 0 auto;
      border: 0;
      background: transparent;
      padding: 0 0 12px;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 14px;
    }

    .nav-tab:hover {
      color: var(--text-sec);
    }

    .nav-tab.active {
      color: var(--text);
      font-weight: 500;
    }

    .nav-tab.active::after {
      position: absolute;
      right: 0;
      bottom: -1px;
      left: 0;
      height: 2px;
      border-radius: 2px 2px 0 0;
      background: var(--accent);
      content: "";
    }

    .today-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid var(--border-soft);
      padding: 8px 0;
    }

    .today-label {
      margin-right: 4px;
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .07em;
      text-transform: uppercase;
    }

    .today-event {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      border: 1px solid var(--border-soft);
      border-radius: 999px;
      background: var(--surface);
      padding: 2px 10px 2px 8px;
      color: var(--text);
      font-size: 12.5px;
      white-space: nowrap;
    }

    .today-event-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--info);
    }

    .today-time {
      color: var(--text-muted);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }

    main {
      padding-top: 28px;
    }

    .period-nav {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-bottom: 14px;
    }

    .icon-button,
    .ghost-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface);
      color: var(--text-sec);
      cursor: pointer;
      transition: background 140ms ease, border-color 140ms ease, color 140ms ease;
    }

    .icon-button:hover,
    .ghost-button:hover {
      border-color: var(--text-muted);
      background: var(--raised);
      color: var(--text);
    }

    .icon-button {
      width: 30px;
      height: 30px;
      padding: 0;
    }

    .period-label {
      min-width: 180px;
      color: var(--text);
      font-size: 15px;
      font-weight: 500;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 28px;
    }

    .view-switch {
      display: flex;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface);
    }

    .view-button {
      min-height: 34px;
      border: 0;
      border-left: 1px solid var(--border);
      background: transparent;
      padding: 7px 14px;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 13.5px;
    }

    .view-button:first-child {
      border-left: 0;
    }

    .view-button:hover {
      background: var(--raised);
      color: var(--text-sec);
    }

    .view-button.active {
      background: var(--raised);
      color: var(--text);
      font-weight: 500;
    }

    .toolbar-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .filter-wrap {
      position: relative;
    }

    .filter-button {
      width: 34px;
      height: 34px;
      padding: 0;
    }

    .filter-button.is-active {
      border-color: var(--text-muted);
      background: var(--raised);
      color: var(--text);
    }

    .add-habit-button {
      min-height: 34px;
      gap: 6px;
      padding: 7px 13px;
      font-size: 13.5px;
    }

    .filter-menu {
      position: absolute;
      top: calc(100% + 6px);
      right: 0;
      z-index: 5;
      display: none;
      width: 176px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface);
      padding: 8px;
      box-shadow: 0 4px 16px oklch(15% 0.01 264 / .10);
    }

    .filter-wrap.open .filter-menu {
      display: block;
    }

    .filter-label {
      display: block;
      padding: 3px 8px 6px;
      color: var(--text-ghost);
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: .09em;
      text-transform: uppercase;
    }

    .filter-option {
      display: flex;
      width: 100%;
      align-items: center;
      gap: 8px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      padding: 7px 8px;
      color: var(--text-sec);
      cursor: pointer;
      text-align: left;
      font-size: 13px;
    }

    .filter-option:hover {
      background: var(--raised);
      color: var(--text);
    }

    .filter-option.active {
      color: var(--text);
      font-weight: 500;
    }

    .filter-check {
      display: inline-flex;
      width: 14px;
      height: 14px;
      align-items: center;
      justify-content: center;
      color: var(--accent);
    }

    .active-filter {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin: -12px 0 16px;
      border-radius: 999px;
      background: var(--raised);
      padding: 2px 9px;
      color: var(--text-sec);
      font-size: 12px;
    }

    .active-filter button {
      border: 0;
      background: transparent;
      color: var(--text-ghost);
      cursor: pointer;
      font-size: 13px;
      line-height: 1;
    }

    .weekday-row,
    .habit-week {
      display: grid;
      grid-template-columns: repeat(7, 28px);
      justify-content: end;
      column-gap: 6px;
    }

    .weekday-row {
      margin-bottom: 7px;
      color: var(--text-ghost);
      font-size: 10px;
      font-weight: 600;
      text-align: center;
    }

    .habit-list {
      border-top: 1px solid var(--border-soft);
    }

    .habit-row {
      border-bottom: 1px solid var(--border-soft);
      padding: 15px 0 14px;
    }

    .habit-main {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 18px;
    }

    .habit-copy {
      min-width: 0;
    }

    .habit-title-row {
      display: flex;
      min-width: 0;
      align-items: center;
      gap: 8px;
    }

    .habit-color {
      width: 7px;
      height: 7px;
      flex: 0 0 auto;
      border-radius: 50%;
    }

    .habit-title {
      overflow: hidden;
      margin: 0;
      color: var(--text);
      font-size: 15px;
      font-weight: 500;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .habit-details {
      margin: 2px 0 0 15px;
      color: var(--text-muted);
      font-size: 12px;
    }

    .habit-progress {
      color: var(--text-muted);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .habit-week {
      margin-top: 11px;
    }

    .habit-day {
      display: inline-flex;
      width: 28px;
      height: 28px;
      align-items: center;
      justify-content: center;
      border: 0;
      border-radius: 50%;
      background: transparent;
      cursor: pointer;
      transition: transform 130ms ease, background 130ms ease, border-color 130ms ease;
    }

    .habit-day:hover {
      transform: scale(1.08);
    }

    .habit-day::after {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      content: "";
    }

    .habit-day.completed::after {
      background: var(--habit-color);
      box-shadow: inset 0 0 0 1px oklch(15% 0.01 264 / .12);
    }

    .habit-day.completed::before {
      position: absolute;
      z-index: 1;
      color: white;
      content: "✓";
      font-size: 10px;
      font-weight: 700;
    }

    .habit-day.missed::after {
      border: 1.5px solid var(--border);
      background: transparent;
    }

    .habit-day.future {
      cursor: default;
    }

    .habit-day.future::after {
      width: 5px;
      height: 5px;
      background: var(--border-soft);
    }

    .habit-day.today:not(.completed)::after {
      border: 1.5px solid var(--habit-color);
      background: transparent;
    }

    .habit-day.today:not(.completed)::before {
      position: absolute;
      z-index: 1;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--habit-color);
      content: "";
    }

    .habit-day {
      position: relative;
    }

    .empty-state {
      padding: 54px 0;
      color: var(--text-ghost);
      text-align: center;
      font-size: 14px;
    }

    .empty-state button {
      display: inline-flex;
      margin-top: 12px;
      border: 0;
      background: transparent;
      color: var(--text-sec);
      cursor: pointer;
      font-size: 13px;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .month-section {
      margin-top: 2px;
    }

    .month-heading {
      margin: 0 0 12px;
      color: var(--text-sec);
      font-size: 13px;
      font-weight: 500;
    }

    .month-grid {
      display: grid;
      grid-template-columns: 112px repeat(7, 1fr);
      overflow: hidden;
      border-top: 1px solid var(--border-soft);
    }

    .month-grid > * {
      min-height: 40px;
      border-bottom: 1px solid var(--border-soft);
    }

    .month-grid .month-date {
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-ghost);
      font-size: 10px;
    }

    .month-habit-name {
      display: flex;
      align-items: center;
      gap: 7px;
      overflow: hidden;
      padding-right: 12px;
      color: var(--text-sec);
      font-size: 13px;
      font-weight: 500;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .month-cell {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .month-cell span {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }

    .month-cell.done span {
      background: var(--habit-color);
    }

    .month-cell.missed span {
      border: 1px solid var(--border);
    }

    .month-cell.future span {
      width: 4px;
      height: 4px;
      background: var(--border-soft);
    }

    @media (max-width: 540px) {
      .workspace {
        padding-right: 16px;
        padding-left: 16px;
      }

      .nav {
        gap: 22px;
      }

      .period-label {
        min-width: 150px;
        font-size: 14px;
      }

      .add-habit-button {
        width: 34px;
        padding: 0;
      }

      .add-habit-button .button-label {
        display: none;
      }

      .habit-main {
        display: block;
      }

      .habit-progress {
        margin: 3px 0 0 15px;
      }

      .weekday-row,
      .habit-week {
        grid-template-columns: repeat(7, 25px);
        column-gap: 4px;
      }

      .habit-week {
        justify-content: start;
        margin-left: 15px;
      }

      .weekday-row {
        justify-content: start;
        margin-left: 15px;
      }

      .habit-day {
        width: 25px;
        height: 25px;
      }

      .habit-day::after {
        width: 17px;
        height: 17px;
      }
    }
  </style>
</head>
<body>
  <div class="workspace">
    <nav class="nav" aria-label="Разделы приложения">
      <button class="nav-tab">Утренний обзор</button>
      <button class="nav-tab">Все задачи</button>
      <button class="nav-tab">Обзор недели</button>
      <button class="nav-tab">Календарь</button>
      <button class="nav-tab active" aria-current="page">Привычки</button>
    </nav>

    <div class="today-bar" aria-label="События сегодня">
      <span class="today-label">Сегодня</span>
      <span class="today-event">
        <span class="today-event-dot" aria-hidden="true"></span>
        <span class="today-time">11:00</span>
        Дэйли
      </span>
      <span class="today-event">
        <span class="today-event-dot" aria-hidden="true"></span>
        <span class="today-time">14:00</span>
        УРОЦП
      </span>
    </div>

    <main>
      <div class="period-nav" aria-label="Навигация по периоду">
        <button class="icon-button" aria-label="Предыдущая неделя">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
            <path d="M9 2L4 7L9 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path>
          </svg>
        </button>

        <span class="period-label">28 сен – 4 окт</span>

        <button class="icon-button" aria-label="Следующая неделя">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
            <path d="M5 2L10 7L5 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path>
          </svg>
        </button>
      </div>

      <div class="toolbar">
        <div class="view-switch" role="group" aria-label="Режим просмотра">
          <button class="view-button active" aria-pressed="true">Неделя</button>
          <button class="view-button" aria-pressed="false">Месяц</button>
        </div>

        <div class="toolbar-actions">
          <div class="filter-wrap" id="filter-wrap">
            <button
              class="icon-button filter-button is-active"
              type="button"
              aria-label="Фильтр привычек"
              aria-expanded="false"
              onclick="toggleFilter()"
            >
              <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
                <path d="M1 3h12M3 7h8M5 11h4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"></path>
              </svg>
            </button>

            <div class="filter-menu" role="menu" aria-label="Фильтр привычек">
              <span class="filter-label">Показать</span>
              <button class="filter-option" role="menuitemradio" aria-checked="false">
                <span class="filter-check"></span>
                Все
              </button>
              <button class="filter-option active" role="menuitemradio" aria-checked="true">
                <span class="filter-check">
                  <svg width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true">
                    <path d="M1 6l3.5 3.5L11 2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path>
                  </svg>
                </span>
                Активные
              </button>
              <button class="filter-option" role="menuitemradio" aria-checked="false">
                <span class="filter-check"></span>
                Выполненные сегодня
              </button>
              <button class="filter-option" role="menuitemradio" aria-checked="false">
                <span class="filter-check"></span>
                Приостановленные
              </button>
            </div>
          </div>

          <button class="ghost-button add-habit-button" aria-label="Добавить привычку">
            <svg width="13" height="13" viewBox="0 0 13 13" fill="none" aria-hidden="true">
              <path d="M6.5 1V12M1 6.5H12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"></path>
            </svg>
            <span class="button-label">Привычка</span>
          </button>
        </div>
      </div>

      <div class="active-filter">
        Активные
        <button aria-label="Сбросить фильтр">×</button>
      </div>

      <div class="weekday-row" aria-hidden="true">
        <span>Пн</span>
        <span>Вт</span>
        <span>Ср</span>
        <span>Чт</span>
        <span>Пт</span>
        <span>Сб</span>
        <span>Вс</span>
      </div>

      <section class="habit-list" aria-label="Привычки на неделю">
        <article class="habit-row" style="--habit-color: oklch(60% 0.14 240);">
          <div class="habit-main">
            <button class="habit-copy" style="border:0; background:transparent; padding:0; text-align:left; cursor:pointer;">
              <div class="habit-title-row">
                <span class="habit-color" aria-hidden="true"></span>
                <h2 class="habit-title">Утренняя прогулка</h2>
              </div>
              <p class="habit-details">Каждый день</p>
            </button>
            <span class="habit-progress">4 / 7</span>
          </div>

          <div class="habit-week" aria-label="Утренняя прогулка: текущая неделя">
            <button class="habit-day completed" aria-label="Понедельник, выполнено"></button>
            <button class="habit-day completed" aria-label="Вторник, выполнено"></button>
            <button class="habit-day completed" aria-label="Среда, выполнено"></button>
            <button class="habit-day today" aria-label="Четверг, отметить выполненной"></button>
            <button class="habit-day future" aria-label="Пятница, будущий день"></button>
            <button class="habit-day future" aria-label="Суббота, будущий день"></button>
            <button class="habit-day future" aria-label="Воскресенье, будущий день"></button>
          </div>
        </article>

        <article class="habit-row" style="--habit-color: oklch(58% 0.14 148);">
          <div class="habit-main">
            <button class="habit-copy" style="border:0; background:transparent; padding:0; text-align:left; cursor:pointer;">
              <div class="habit-title-row">
                <span class="habit-color" aria-hidden="true"></span>
                <h2 class="habit-title">Чтение 20 минут</h2>
              </div>
              <p class="habit-details">Каждый день</p>
            </button>
            <span class="habit-progress">2 / 7</span>
          </div>

          <div class="habit-week" aria-label="Чтение 20 минут: текущая неделя">
            <button class="habit-day completed" aria-label="Понедельник, выполнено"></button>
            <button class="habit-day missed" aria-label="Вторник, не выполнено"></button>
            <button class="habit-day completed" aria-label="Среда, выполнено"></button>
            <button class="habit-day today" aria-label="Четверг, отметить выполненной"></button>
            <button class="habit-day future" aria-label="Пятница, будущий день"></button>
            <button class="habit-day future" aria-label="Суббота, будущий день"></button>
            <button class="habit-day future" aria-label="Воскресенье, будущий день"></button>
          </div>
        </article>

        <article class="habit-row" style="--habit-color: oklch(66% 0.13 68);">
          <div class="habit-main">
            <button class="habit-copy" style="border:0; background:transparent; padding:0; text-align:left; cursor:pointer;">
              <div class="habit-title-row">
                <span class="habit-color" aria-hidden="true"></span>
                <h2 class="habit-title">Растяжка</h2>
              </div>
              <p class="habit-details">5 раз в неделю</p>
            </button>
            <span class="habit-progress">0 / 5</span>
          </div>

          <div class="habit-week" aria-label="Растяжка: текущая неделя">
            <button class="habit-day missed" aria-label="Понедельник, не выполнено"></button>
            <button class="habit-day missed" aria-label="Вторник, не выполнено"></button>
            <button class="habit-day missed" aria-label="Среда, не выполнено"></button>
            <button class="habit-day today" aria-label="Четверг, отметить выполненной"></button>
            <button class="habit-day future" aria-label="Пятница, будущий день"></button>
            <button class="habit-day future" aria-label="Суббота, будущий день"></button>
            <button class="habit-day future" aria-label="Воскресенье, будущий день"></button>
          </div>
        </article>

        <article class="habit-row" style="--habit-color: oklch(58% 0.13 300);">
          <div class="habit-main">
            <button class="habit-copy" style="border:0; background:transparent; padding:0; text-align:left; cursor:pointer;">
              <div class="habit-title-row">
                <span class="habit-color" aria-hidden="true"></span>
                <h2 class="habit-title">Без телефона за завтраком</h2>
              </div>
              <p class="habit-details">По будням</p>
            </button>
            <span class="habit-progress">3 / 5</span>
          </div>

          <div class="habit-week" aria-label="Без телефона за завтраком: текущая неделя">
            <button class="habit-day completed" aria-label="Понедельник, выполнено"></button>
            <button class="habit-day completed" aria-label="Вторник, выполнено"></button>
            <button class="habit-day completed" aria-label="Среда, выполнено"></button>
            <button class="habit-day today" aria-label="Четверг, отметить выполненной"></button>
            <button class="habit-day future" aria-label="Пятница, будущий день"></button>
            <button class="habit-day future" aria-label="Суббота, будущий день"></button>
            <button class="habit-day future" aria-label="Воскресенье, будущий день"></button>
          </div>
        </article>
      </section>
    </main>
  </div>

  <script>
    function toggleFilter() {
      const wrapper = document.getElementById("filter-wrap");
      const button = wrapper.querySelector(".filter-button");
      const isOpen = wrapper.classList.toggle("open");
      button.setAttribute("aria-expanded", String(isOpen));
    }

    document.addEventListener("click", (event) => {
      const wrapper = document.getElementById("filter-wrap");
      if (!wrapper.contains(event.target)) {
        wrapper.classList.remove("open");
        wrapper.querySelector(".filter-button").setAttribute("aria-expanded", "false");
      }
    });

    document.querySelectorAll(".filter-option").forEach((option) => {
      option.addEventListener("click", () => {
        document.querySelectorAll(".filter-option").forEach((item) => {
          item.classList.remove("active");
          item.setAttribute("aria-checked", "false");
          item.querySelector(".filter-check").innerHTML = "";
        });

        option.classList.add("active");
        option.setAttribute("aria-checked", "true");
        option.querySelector(".filter-check").innerHTML = `
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true">
            <path d="M1 6l3.5 3.5L11 2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path>
          </svg>
        `;
      });
    });

    document.querySelectorAll(".habit-day:not(.future)").forEach((day) => {
      day.addEventListener("click", () => {
        const wasCompleted = day.classList.contains("completed");
        day.classList.remove("completed", "missed", "today");

        if (wasCompleted) {
          day.classList.add("missed");
          day.setAttribute("aria-label", day.getAttribute("aria-label").replace("выполнено", "не выполнено"));
        } else {
          day.classList.add("completed");
          day.setAttribute("aria-label", day.getAttribute("aria-label").replace("не выполнено", "выполнено").replace("отметить выполненной", "выполнено"));
        }
      });
    });
  </script>
</body>
</html>
